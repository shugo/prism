name: CRuby bindings

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-all:
    strategy:
      fail-fast: false
      matrix:
        # Some tests in this repository are only run against parse.y
        # We test them here in order to not fail ruby/ruby CI.
        parser:
          - prism
          - parse.y

    runs-on: ubuntu-24.04
    steps:
      - name: Set up latest ruby head
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler: none
      - uses: actions/checkout@v7
        with:
          repository: ruby/ruby
          path: ruby/ruby
          fetch-depth: 1
      - name: Install libraries
        run: |
          set -x
          sudo apt-get update -q || :
          sudo apt-get install --no-install-recommends -q -y build-essential libssl-dev libyaml-dev libreadline6-dev zlib1g-dev libncurses5-dev libffi-dev libgdbm-dev autoconf ruby
      - uses: actions/checkout@v7
        with:
          path: ruby/prism
          fetch-depth: 1
      - name: Generate the parse.y backend's parser
        # The generated parser is not checked in; CRuby vendors lrama for its
        # own parse.y, so use that copy before the sync picks the file up.
        working-directory: ruby/prism/src/parsey
        run: ruby tool/id2token.rb parse.y | ruby -I../../../ruby/tool/lrama/lib ../../../ruby/tool/lrama/exe/lrama -oparse.c -Hparse.h - parse.y
      - run: tool/sync_default_gems.rb prism
        working-directory: ruby/ruby
      - name: Add the parse.y backend to CRuby's prism build
        # CRuby's common.mk lists the prism objects explicitly and does not
        # know about the parse.y backend yet; patch the synced build so the
        # backend links (this is the change CRuby itself would carry).
        run: |
          ruby -i -pe 'sub(/prism\/tokens\.\$\(OBJEXT\)/) { "prism/parsey/parse.$(OBJEXT) \\\n\t\tprism/parsey/yid.$(OBJEXT) \\\n\t\tprism/parsey/ystring.$(OBJEXT) \\\n\t\t#{$&}" }' common.mk
          ruby -i -pe 'gsub(/\$\(PRISM_BUILD_DIR\)\/util\/\.time/) { "#{$&} $(PRISM_BUILD_DIR)/parsey/.time" }' common.mk
          grep -n "parsey" common.mk
        working-directory: ruby/ruby
      - name: Build Ruby
        run: |
          ruby tool/downloader.rb -d tool -e gnu config.guess config.sub
          autoconf
          ./configure -C --disable-install-doc --with-parser=${{ matrix.parser }} --with-gcc 'debugflags=-save-temps=obj -g'
          make -j$(nproc)
        working-directory: ruby/ruby
      - name: make test-all
        env:
          RUN_OPTS: --parser=${{ matrix.parser }}
          EXCLUDES: ${{ matrix.parser == 'parse.y' && './test/.excludes-parsey' }}
        run: make -j$(nproc) -s test-all
        working-directory: ruby/ruby

      - name: Update depend files
        run: make fix-depends
        working-directory: ruby/ruby
      - name: Check depend is up-to-date
        # The parse.y backend's objects are patched into common.mk above, so
        # their dependency lines are necessarily missing from CRuby's checked
        # -in depend files until CRuby carries the change; report the diff
        # without failing the job.
        continue-on-error: true
        run: git diff --color --no-ext-diff --ignore-submodules --exit-code -- depend
        working-directory: ruby/ruby

